name: Windows x64 Build (MouseMod)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enable_ui_access:
        type: boolean
        default: false
        description: Enable UIAccess in manifest (requires signed binary in Program Files).

permissions:
  contents: read

concurrency:
  group: windows-x64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          targets: x86_64-pc-windows-msvc
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}

      - name: Build Windows x64 binaries
        env:
          VERSION_NUMBER: 0.1.${{ github.run_number }}
          FEATURES: ${{ inputs.enable_ui_access && '--features ui_access' || '' }}
        shell: bash
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --workspace $FEATURES

      - name: Collect binaries for portable testing
        shell: bash
        run: |
          SOURCE_DIR="target/x86_64-pc-windows-msvc/release"
          mkdir -p dist
          cp "$SOURCE_DIR/glazewm.exe" \
             "$SOURCE_DIR/glazewm-cli.exe" \
             "$SOURCE_DIR/glazewm-watcher.exe" \
             dist/

      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: glazewm-mousemod-windows-x64
          path: dist
